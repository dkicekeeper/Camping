name: Map tiles

# Своя карта в Cloudflare R2 (map/README.md): стили, шрифты и значки — при изменениях в map/ в main;
# тайлы региона из OpenStreetMap (Planetiler) — вручную и раз в месяц; рельеф и горизонтали из
# Copernicus DEM (map/relief.py) — вручную: высоты не меняются.
# Секреты: R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (Account ID — в map/config.json); бакет —
# переменная R2_BUCKET (по умолчанию dalada-tiles).
on:
  workflow_dispatch:
    inputs:
      tiles:
        description: "Пересобрать тайлы (15–40 минут); без галочки — только стили, шрифты и значки"
        type: boolean
        default: true
      relief:
        description: "Пересобрать рельеф и горизонтали (Copernicus DEM, 20–40 минут)"
        type: boolean
        default: false
  schedule:
    - cron: "23 2 3 * *"
  push:
    branches: [main]
    paths:
      - "map/**"
      - ".github/workflows/tiles.yml"

concurrency:
  group: map-tiles
  cancel-in-progress: false

env:
  R2_BUCKET: ${{ vars.R2_BUCKET || 'dalada-tiles' }}
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"

jobs:
  # Рельеф — раньше стилей: стиль ссылается на эти тайлы.
  relief:
    name: Relief and contours
    if: github.event_name == 'workflow_dispatch' && inputs.relief
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: R2 access
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash map/r2_env.sh

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone gdal-bin python3-gdal python3-numpy python3-pil tippecanoe > /dev/null
          gdalinfo --version && tippecanoe --version 2>&1 | head -1

      - name: Copernicus DEM
        run: |
          python3 map/relief.py download data/dem
          bounds=$(python3 -c "import json; print(' '.join(map(str, json.load(open('map/config.json'))['bounds'])))")
          gdalbuildvrt -q data/dem.vrt data/dem/*.tif
          gdalbuildvrt -q -te $bounds data/region.vrt data/dem/*.tif
          du -sh data/dem

      # Горизонтали: через 100 м — по высотам, усреднённым до ~90 м (масштабы 11–12), через 20 м — по
      # исходным ~30 м (13-й; крупнее MapLibre растягивает). Короткие замкнутые линии (бугорки, шум
      # высот) отбрасываем; idx = 1 — у горизонталей, кратных 100 м (толще и с подписью).
      - name: Contours
        run: |
          read z0 z1 < <(python3 -c "import json; r = json.load(open('map/config.json'))['relief']['contour_zooms']; print(r[0], r[1])")
          gdal_contour -q -a ele -i 20 -f FlatGeobuf data/region.vrt data/c20.fgb
          gdalwarp -q -r average -tr 0.000833333333 0.000833333333 data/region.vrt data/dem90.tif
          gdal_contour -q -a ele -i 100 -f FlatGeobuf data/dem90.tif data/c100.fgb
          ogr2ogr -f FlatGeobuf data/m20.fgb data/c20.fgb -dialect sqlite -sql \
            "SELECT geometry, CAST(ele AS INTEGER) AS ele, CAST(ele AS INTEGER) % 100 = 0 AS idx FROM contour WHERE ST_Length(geometry) > 0.003"
          ogr2ogr -f FlatGeobuf data/m100.fgb data/c100.fgb -dialect sqlite -sql \
            "SELECT geometry, CAST(ele AS INTEGER) AS ele, 1 AS idx FROM contour WHERE ST_Length(geometry) > 0.006"
          rm data/c20.fgb data/c100.fgb data/dem90.tif
          ls -la data/*.fgb
          # -T: из FlatGeobuf tippecanoe читает целые как строки — просим числа.
          tippecanoe -q -f -o data/contours-low.mbtiles -l contour -T ele:int -T idx:int -Z"$z0" -z"$((z1 - 1))" data/m100.fgb
          tippecanoe -q -f -o data/contours-high.mbtiles -l contour -T ele:int -T idx:int -Z"$z1" -z"$z1" data/m20.fgb
          tile-join -q -f -o data/contours.mbtiles data/contours-low.mbtiles data/contours-high.mbtiles
          python3 map/dump_mbtiles.py data/contours.mbtiles public/contours

      - name: Terrain tiles
        run: python3 map/relief.py terrain data/dem.vrt public/relief

      - name: Upload
        run: |
          base=$(python3 -c "import json; print(json.load(open('map/config.json'))['public_base'])")
          rclone copy public/contours "r2:$R2_BUCKET/contours" --checksum --transfers 96 --checkers 96 --fast-list \
            --header-upload "Content-Encoding: gzip" --header-upload "Content-Type: application/x-protobuf" \
            --header-upload "Cache-Control: public, max-age=604800" --stats 60s --stats-one-line
          rclone copy public/relief "r2:$R2_BUCKET/relief" --checksum --transfers 96 --checkers 96 --fast-list \
            --header-upload "Content-Type: image/png" \
            --header-upload "Cache-Control: public, max-age=604800" --stats 60s --stats-one-line
          for path in "contours/$(cd public/contours && ls -d 13/*/* | head -1)" "relief/$(cd public/relief && ls -d 12/*/* | head -1)"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Accept-Encoding: gzip" "$base/$path")
            echo "$base/$path → $code"
            [ "$code" = 200 ] || exit 1
          done
          {
            echo "Горизонтали: $(find public/contours -name '*.pbf' | wc -l) тайлов, $(du -sh public/contours | cut -f1)"
            echo "Высоты: $(find public/relief -name '*.png' | wc -l) тайлов, $(du -sh public/relief | cut -f1)"
            echo
            python3 map/region_sizes.py public/relief public/contours
          } >> "$GITHUB_STEP_SUMMARY"
          python3 map/region_sizes.py public/relief public/contours

  assets:
    name: Styles, fonts and sprites
    needs: relief
    # Рельеф пересобирается не всегда: стили выкладываем, если он пропущен или собрался.
    if: ${{ !cancelled() && needs.relief.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: R2 access
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash map/r2_env.sh

      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone > /dev/null

      - name: Build styles
        run: python3 map/build_style.py public

      # Шрифты Noto Sans для подписей (OFL) — из maplibre/demotiles.
      - name: Fonts
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/maplibre/demotiles "$RUNNER_TEMP/demotiles"
          git -C "$RUNNER_TEMP/demotiles" sparse-checkout set font
          mkdir -p public/fonts
          for font in "Noto Sans Regular" "Noto Sans Bold" "Noto Sans Italic"; do
            cp -r "$RUNNER_TEMP/demotiles/font/$font" public/fonts/
          done

      - name: Upload
        run: |
          base=$(python3 -c "import json; print(json.load(open('map/config.json'))['public_base'])")
          rclone copy public/fonts "r2:$R2_BUCKET/fonts" --checksum --transfers 32 \
            --header-upload "Cache-Control: public, max-age=604800" --header-upload "Content-Type: application/x-protobuf"
          rclone copy public/sprites "r2:$R2_BUCKET/sprites" --checksum \
            --header-upload "Cache-Control: public, max-age=604800"
          rclone copy public/styles "r2:$R2_BUCKET/styles" --checksum \
            --header-upload "Cache-Control: public, max-age=300" --header-upload "Content-Type: application/json"
          for path in styles/liberty.ru.json "fonts/Noto%20Sans%20Regular/1024-1279.pbf" sprites/v1/ofm@2x.png; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$base/$path")
            echo "$base/$path → $code"
            [ "$code" = 200 ] || { echo "::error::Файл не открывается по публичному адресу — включён ли Public Development URL у бакета?"; exit 1; }
          done

  tiles:
    name: Region tiles
    needs: assets
    # Без !cancelled() пропущенный рельеф (он выше по цепочке) пропустил бы и эту задачу.
    if: ${{ !cancelled() && needs.assets.result == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tiles)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: R2 access
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash map/r2_env.sh

      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone osmium-tool > /dev/null
          curl -sSfL -o "$RUNNER_TEMP/planetiler.jar" https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

      # Казахстан и Кыргызстан (у границы, к югу от Алматы) — выгрузки Geofabrik, обрезанные по региону.
      - name: OpenStreetMap extract
        run: |
          mkdir -p data
          # Ссылка «-latest» на Geofabrik с адресов GitHub Actions уводит в бесконечные перенаправления
          # (301 на тот же адрес со слешем) — берём выгрузку за последние дни по дате в имени файла.
          fetch() {
            local base="https://download.geofabrik.de/asia/$2"
            for days in 1 2 3 4; do
              local day=$(date -u -d "-$days day" +%y%m%d)
              if curl -sSfL --retry 2 --max-redirs 3 -o "data/$1.osm.pbf" "$base-$day.osm.pbf"; then
                echo "$2: выгрузка $day"
                ls -la "data/$1.osm.pbf"
                return 0
              fi
            done
            curl -sSfL --retry 2 --max-redirs 3 -o "data/$1.osm.pbf" "$base-latest.osm.pbf"
          }
          fetch kz kazakhstan
          fetch kg kyrgyzstan
          bounds=$(python3 -c "import json; print(','.join(map(str, json.load(open('map/config.json'))['bounds'])))")
          osmium merge data/kz.osm.pbf data/kg.osm.pbf -o data/merged.osm.pbf
          osmium extract --bbox "$bounds" --strategy smart data/merged.osm.pbf -o data/region.osm.pbf
          osmium fileinfo -e data/region.osm.pbf | grep -E "Number of (nodes|ways|relations)|Timestamp"
          echo "BOUNDS=$bounds" >> "$GITHUB_ENV"

      - name: Planetiler
        run: |
          java -Xmx10g -jar "$RUNNER_TEMP/planetiler.jar" \
            --osm_path=data/region.osm.pbf --download --download_dir=data/sources \
            --bounds="$BOUNDS" --maxzoom=14 --languages=ru,kk,en \
            --tile_compression=gzip --output=data/region.mbtiles --force
          python3 map/dump_mbtiles.py data/region.mbtiles public/tiles

      - name: Upload
        run: |
          base=$(python3 -c "import json; print(json.load(open('map/config.json'))['public_base'])")
          rclone copy public/tiles "r2:$R2_BUCKET/tiles" --checksum --transfers 96 --checkers 96 --fast-list \
            --header-upload "Content-Encoding: gzip" --header-upload "Content-Type: application/x-protobuf" \
            --header-upload "Cache-Control: public, max-age=86400" --stats 60s --stats-one-line
          tile=$(cd public/tiles && ls -d 10/*/* | head -1)
          curl -sS -D - -o /dev/null "$base/tiles/$tile" | grep -iE "^HTTP|content-encoding|content-type"
          echo "Тайлы: $(find public/tiles -name '*.pbf' | wc -l), $(du -sh public/tiles | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
