name: Push check

# Проверка пушей в облачном проекте: секреты функции и Vault (только имена), устройства (числа),
# очередь и ответы функции. С username — отправить этому человеку проверочное уведомление
# («Уведомления работают»). Секреты: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF.
on:
  workflow_dispatch:
    inputs:
      username:
        description: "Кому отправить проверочное уведомление (username без @; пусто — только проверка)"
        required: false
        default: ""

jobs:
  check:
    name: Check push setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          USERNAME: ${{ inputs.username }}
        run: bash supabase/scripts/push_check.sh
