name: TestFlight

# Сборка для iPhone и загрузка в TestFlight без своего Mac: собирает Mac в GitHub Actions,
# подпись — облачная (Xcode сам создаёт сертификат и профиль по ключу App Store Connect API).
# Запуск: GitHub → Actions → TestFlight → Run workflow (можно с телефона).
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 — ключ App Store Connect API (роль Admin),
#   SUPABASE_HOST, SUPABASE_KEY — как в ios/Config/Secrets.xcconfig.
# Пошагово — docs/04-beta/testflight.md.
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  TEAM_ID: SY2L2VMQP7

jobs:
  upload:
    name: Archive and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      build: ${{ steps.archive.outputs.build }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 SUPABASE_HOST SUPABASE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing (см. docs/04-beta/testflight.md)"
            exit 1
          fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        working-directory: ios
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          brew install xcodegen
          printf 'SUPABASE_HOST = %s\nSUPABASE_KEY = %s\n' "$SUPABASE_HOST" "$SUPABASE_KEY" > Config/Secrets.xcconfig
          xcodegen generate

      - name: Save App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      # Идентификаторы приложения и расширения. Для отладочной сборки Xcode обходится общим профилем
      # команды, а для App Store каждому таргету нужен свой зарегистрированный идентификатор;
      # из xcodebuild по ключу API он его не создаёт («cannot register bundle identifier»).
      - name: Register bundle identifiers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/ascenv"
          "$RUNNER_TEMP/ascenv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/ascenv/bin/python" - <<'PY'
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request
          import jwt

          now = int(time.time())
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
              open(os.environ["ASC_KEY_PATH"]).read(),
              algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
          )

          def call(method, path, body=None):
              request = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com/v1" + path,
                  method=method,
                  data=json.dumps(body).encode() if body else None,
                  headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print(f"::error::App Store Connect API {method} {path}: HTTP {error.code} "
                        + error.read().decode(errors="replace")[:500])
                  if error.code in (401, 403):
                      print("::error::Ключ не может регистрировать идентификаторы: нужна роль Admin "
                            "(docs/04-beta/testflight.md, шаг 2) или регистрация вручную на developer.apple.com.")
                  sys.exit(1)

          for identifier, name in [("app.dalada.ios", "Dalada"), ("app.dalada.ios.widgets", "Dalada Widgets")]:
              query = urllib.parse.urlencode({"filter[identifier]": identifier, "limit": 200})
              found = call("GET", "/bundleIds?" + query).get("data", [])
              if any(item["attributes"]["identifier"] == identifier for item in found):
                  print(f"{identifier}: уже зарегистрирован")
                  continue
              call("POST", "/bundleIds", {"data": {"type": "bundleIds", "attributes": {
                  "identifier": identifier, "name": name, "platform": "IOS"}}})
              print(f"{identifier}: зарегистрирован")

          # Пуш-уведомления (aps-environment в Dalada.entitlements): возможность у идентификатора
          # приложения. Обычно её включает и сама подпись; ошибка здесь — только предупреждение.
          query = urllib.parse.urlencode({"filter[identifier]": "app.dalada.ios", "limit": 200})
          app = next(item for item in call("GET", "/bundleIds?" + query)["data"]
                     if item["attributes"]["identifier"] == "app.dalada.ios")
          capabilities = call("GET", f"/bundleIds/{app['id']}/bundleIdCapabilities").get("data", [])
          if any(c["attributes"].get("capabilityType") == "PUSH_NOTIFICATIONS" for c in capabilities):
              print("app.dalada.ios: пуши уже включены")
          else:
              request = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com/v1/bundleIdCapabilities",
                  method="POST",
                  data=json.dumps({"data": {"type": "bundleIdCapabilities",
                                            "attributes": {"capabilityType": "PUSH_NOTIFICATIONS"},
                                            "relationships": {"bundleId": {"data": {"type": "bundleIds", "id": app["id"]}}}}}).encode(),
                  headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
              )
              try:
                  urllib.request.urlopen(request).read()
                  print("app.dalada.ios: пуши включены")
              except urllib.error.HTTPError as error:
                  print(f"::warning::Не удалось включить пуши у app.dalada.ios: HTTP {error.code} "
                        + error.read().decode(errors="replace")[:300])
          PY

      - name: Archive
        id: archive
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Номер сборки растёт с каждым запуском; +100 — чтобы не совпасть с загрузками из Xcode.
          BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))
          echo "Build number: $BUILD_NUMBER"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          xcodebuild archive \
            -project Dalada.xcodeproj \
            -scheme Dalada \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Dalada.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -quiet \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Dalada.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Загружено. Через 10–30 минут сборка появится в TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

  # What to Test и заметки для проверки — когда App Store Connect обработает сборку.
  info:
    name: TestFlight texts
    needs: upload
    uses: ./.github/workflows/testflight-info.yml
    with:
      build: ${{ needs.upload.outputs.build }}
      wait: 45
    secrets: inherit
