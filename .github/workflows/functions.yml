name: Edge Functions

# Деплой Edge Functions (supabase/functions) в облачный проект при изменениях в main.
# Секреты репозитория: SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens) и
# SUPABASE_PROJECT_REF (id проекта из адреса дашборда). Секреты самих функций (APNs и т. п.) —
# в Supabase → Edge Functions → Secrets, см. docs/04-beta/M6-beta-readiness.md.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/functions.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Unit tests and type check
        working-directory: supabase/functions/push
        run: |
          deno test --allow-net=jsr.io message_test.ts
          deno check index.ts

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy push
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Нет секретов SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF — функция не задеплоена (docs/04-beta/M6-beta-readiness.md)."
            exit 0
          fi
          supabase functions deploy push --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
